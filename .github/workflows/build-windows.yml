name: Build Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for artifacts"
        required: false
        default: ""
  push:
    branches: [publish]

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_INPUT="${{ inputs.version }}"
          if [ -n "$VERSION_INPUT" ]; then
            VERSION="$VERSION_INPUT"
          else
            VERSION="$(python3 scripts/get_project_version.py)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -c constraints/build.txt ".[build]"
      - name: Prepare Windows icon
        shell: cmd
        run: >
          python -c "from PIL import Image; src='app/ui/icons/app_icons/app_icon_96_96.png'; dst='app/ui/icons/app_icons/app_icon.ico';
          img=Image.open(src).convert('RGBA'); img.save(dst, sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(96,96)]); print('Saved', dst)"
      - name: Build (portable onedir)
        shell: cmd
        run: >
          pyinstaller --noconfirm --windowed --name NetPlanner
          --icon "app\\ui\\icons\\app_icons\\app_icon.ico"
          --add-data "app\\web;app\\web"
          --add-data "app\\ui\\icons;app\\ui\\icons"
          --add-data "app\\icon.svg;app\\icon.svg"
          --collect-data PySide6
          --collect-data PySide6.QtWebEngineCore
          --collect-data PySide6.QtWebEngineWidgets
          --collect-binaries PySide6
          --collect-binaries PySide6.QtWebEngineCore
          --collect-binaries PySide6.QtWebEngineWidgets
          --collect-submodules PySide6
          app\\main.py
      - name: Package artifact
        run: |
          Compress-Archive -Path dist\\NetPlanner\\* -DestinationPath NetPlanner-${{ needs.prepare.outputs.version }}-portable-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NetPlanner-${{ needs.prepare.outputs.version }}-portable-windows-x86_64
          path: NetPlanner-${{ needs.prepare.outputs.version }}-portable-windows-x86_64.zip
