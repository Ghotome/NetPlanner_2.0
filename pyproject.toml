[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "netplanner"
version = "2.6.3"
description = "Кросплатформений додаток для моделювання і моніторингу ІР мережі."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "fish.head" }]
keywords = ["network", "mapping", "planner", "qt"]
dependencies = [
  "Pillow>=10,<11",
  "PySide6>=6.6,<6.7",
]

[project.optional-dependencies]
geo = [
  "mgrs>=1.5,<2",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]
build = [
  "pyinstaller>=6.17,<7",
]

[project.scripts]
netplanner = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
extend-exclude = [".venv", ".git", "dist", "build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
