name: Build Release (All Platforms)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for artifacts"
        required: false
        default: ""
  pull_request:
    types: [closed]

jobs:
  prepare:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'publish') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      has_appimagetool_aarch64: ${{ steps.tools.outputs.has_appimagetool_aarch64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_INPUT="${{ inputs.version }}"
          VERSION=""
          if [ -n "$VERSION_INPUT" ]; then
            VERSION="$VERSION_INPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.ref_name }}" ]; then
            VERSION="$(echo "${{ github.ref_name }}" | sed 's/^v//')"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            TITLE="${{ github.event.pull_request.title }}"
            BODY="${{ github.event.pull_request.body }}"
            if echo "$TITLE" | grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' >/dev/null; then
              VERSION="$(echo "$TITLE" | grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1 | sed 's/^v//')"
            elif echo "$BODY" | grep -Eo '[Vv]ersion:\s*[0-9]+\.[0-9]+\.[0-9]+' >/dev/null; then
              VERSION="$(echo "$BODY" | grep -Eo '[Vv]ersion:\s*[0-9]+\.[0-9]+\.[0-9]+' | head -n1 | sed -E 's/^[Vv]ersion:\s*//')"
            elif echo "$BODY" | grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' >/dev/null; then
              VERSION="$(echo "$BODY" | grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1 | sed 's/^v//')"
            fi
          else
            MSG="$(git log -1 --pretty=%s)"
            if echo "$MSG" | grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' >/dev/null; then
              VERSION="$(echo "$MSG" | grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1 | sed 's/^v//')"
            fi
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(python3 scripts/get_project_version.py)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - id: tools
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tools/appimagetool-aarch64.AppImage ] && [ -f tools/appimagetool-aarch64.AppImage.sha256 ]; then
            echo "has_appimagetool_aarch64=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_appimagetool_aarch64=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping aarch64 AppImage build. Vendored tools/appimagetool-aarch64.AppImage (+ .sha256) not found."
          fi

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -c constraints/build.txt ".[build]"
      - name: Prepare Windows icon
        shell: cmd
        run: >
          python -c "from PIL import Image; src='app/ui/icons/app_icons/app_icon_96_96.png'; dst='app/ui/icons/app_icons/app_icon.ico';
          img=Image.open(src).convert('RGBA'); img.save(dst, sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(96,96)]); print('Saved', dst)"
      - name: Build (portable onedir)
        shell: cmd
        run: >
          pyinstaller --noconfirm --windowed --name NetPlanner
          --icon "app\\ui\\icons\\app_icons\\app_icon.ico"
          --add-data "app\\web;app\\web"
          --add-data "app\\ui\\icons;app\\ui\\icons"
          --add-data "app\\icon.svg;app\\icon.svg"
          --collect-data PySide6
          --collect-data PySide6.QtWebEngineCore
          --collect-data PySide6.QtWebEngineWidgets
          --collect-binaries PySide6
          --collect-binaries PySide6.QtWebEngineCore
          --collect-binaries PySide6.QtWebEngineWidgets
          --collect-submodules PySide6
          app\\main.py
      - name: Package artifact
        run: |
          Compress-Archive -Path dist\\NetPlanner\\* -DestinationPath NetPlanner-${{ needs.prepare.outputs.version }}-portable-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-NetPlanner-${{ needs.prepare.outputs.version }}-portable-x86_64
          path: NetPlanner-${{ needs.prepare.outputs.version }}-portable-x86_64.zip

  ubuntu_deb:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install RPM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Build Linux dist
        run: |
          scripts/build_linux_dist.sh
      - name: Build DEB
        run: |
          NETPLANNER_SKIP_BUILD=1 VERSION=${{ needs.prepare.outputs.version }} scripts/build_deb.sh
      - name: Build RPM
        run: |
          NETPLANNER_SKIP_BUILD=1 VERSION=${{ needs.prepare.outputs.version }} scripts/build_rpm.sh
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: NetPlanner-${{ needs.prepare.outputs.version }}-deb-x86_64
          path: build/deb/NetPlanner-${{ needs.prepare.outputs.version }}-deb-x86_64.deb
      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: NetPlanner-${{ needs.prepare.outputs.version }}-rpm-x86_64
          path: build/rpm/NetPlanner-${{ needs.prepare.outputs.version }}-rpm-x86_64.rpm
  ubuntu_appimage_x86_64:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Linux dist
        run: |
          scripts/build_linux_dist.sh
      - name: Build AppImage
        run: |
          NETPLANNER_SKIP_BUILD=1 VERSION=${{ needs.prepare.outputs.version }} APPIMAGE_ARCH=x86_64 APPIMAGETOOL_ARCH=x86_64 scripts/build_appimage.sh
      - name: Build portable tar.gz
        run: |
          NETPLANNER_SKIP_BUILD=1 VERSION=${{ needs.prepare.outputs.version }} PORTABLE_ARCH=x86_64 scripts/build_tarball.sh
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: NetPlanner-${{ needs.prepare.outputs.version }}-appimage-x86_64
          path: NetPlanner-${{ needs.prepare.outputs.version }}-appimage-x86_64.AppImage
      - name: Upload portable tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: linux-NetPlanner-${{ needs.prepare.outputs.version }}-portable-x86_64
          path: build/tar/NetPlanner-${{ needs.prepare.outputs.version }}-portable-x86_64.tar.gz
  ubuntu_appimage_aarch64:
    needs: prepare
    if: ${{ needs.prepare.outputs.has_appimagetool_aarch64 == 'true' }}
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Linux dist
        run: |
          scripts/build_linux_dist.sh
      - name: Build AppImage
        run: |
          NETPLANNER_SKIP_BUILD=1 VERSION=${{ needs.prepare.outputs.version }} APPIMAGE_ARCH=aarch64 APPIMAGETOOL_ARCH=aarch64 scripts/build_appimage.sh
      - name: Build portable tar.gz
        run: |
          NETPLANNER_SKIP_BUILD=1 VERSION=${{ needs.prepare.outputs.version }} PORTABLE_ARCH=aarch64 scripts/build_tarball.sh
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: NetPlanner-${{ needs.prepare.outputs.version }}-appimage-aarch64
          path: NetPlanner-${{ needs.prepare.outputs.version }}-appimage-aarch64.AppImage
      - name: Upload portable tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: linux-NetPlanner-${{ needs.prepare.outputs.version }}-portable-aarch64
          path: build/tar/NetPlanner-${{ needs.prepare.outputs.version }}-portable-aarch64.tar.gz

  release:
    needs: [prepare, windows, ubuntu_deb, ubuntu_appimage_x86_64, ubuntu_appimage_aarch64]
    if: >-
      ${{ always()
          && !contains(needs.*.result, 'failure')
          && !contains(needs.*.result, 'cancelled')
          && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
          || (github.event_name == 'pull_request' && github.event.pull_request.merged == true
              && github.event.pull_request.base.ref == 'publish')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          files: |
            artifacts/**/*
