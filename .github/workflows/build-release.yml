name: Build Release (All Platforms)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for artifacts"
        required: false
        default: ""
  push:
    tags:
      - "v*"
  pull_request:
    types: [closed]

jobs:
  prepare:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'publish') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_INPUT="${{ inputs.version }}"
          VERSION=""
          if [ -n "$VERSION_INPUT" ]; then
            VERSION="$VERSION_INPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.ref_name }}" ]; then
            VERSION="$(echo "${{ github.ref_name }}" | sed 's/^v//')"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            TITLE="${{ github.event.pull_request.title }}"
            BODY="${{ github.event.pull_request.body }}"
            if echo "$TITLE" | grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' >/dev/null; then
              VERSION="$(echo "$TITLE" | grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1 | sed 's/^v//')"
            elif echo "$BODY" | grep -Eo '[Vv]ersion:\s*[0-9]+\.[0-9]+\.[0-9]+' >/dev/null; then
              VERSION="$(echo "$BODY" | grep -Eo '[Vv]ersion:\s*[0-9]+\.[0-9]+\.[0-9]+' | head -n1 | sed -E 's/^[Vv]ersion:\s*//')"
            elif echo "$BODY" | grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' >/dev/null; then
              VERSION="$(echo "$BODY" | grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1 | sed 's/^v//')"
            fi
          else
            MSG="$(git log -1 --pretty=%s)"
            if echo "$MSG" | grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' >/dev/null; then
              VERSION="$(echo "$MSG" | grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1 | sed 's/^v//')"
            fi
          fi
          if [ -z "$VERSION" ]; then
            VERSION="0.0.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Prepare Windows icon
        shell: cmd
        run: >
          python -c "from PIL import Image; src='app/ui/icons/app_icons/app_icon_96_96.png'; dst='app/ui/icons/app_icons/app_icon.ico';
          img=Image.open(src).convert('RGBA'); img.save(dst, sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(96,96)]); print('Saved', dst)"
      - name: Build (portable onedir)
        shell: cmd
        run: >
          pyinstaller --noconfirm --windowed --name NetPlanner
          --icon "app\\ui\\icons\\app_icons\\app_icon.ico"
          --add-data "app\\web;app\\web"
          --add-data "app\\ui\\icons;app\\ui\\icons"
          --add-data "app\\icon.svg;app\\icon.svg"
          --collect-data PySide6
          --collect-data PySide6.QtWebEngineCore
          --collect-data PySide6.QtWebEngineWidgets
          --collect-submodules PySide6
          --collect-submodules PySide6.QtWebEngineCore
          --collect-submodules PySide6.QtWebEngineWidgets
          app\\main.py
      - name: Package artifact
        run: |
          Compress-Archive -Path dist\\NetPlanner\\* -DestinationPath NetPlanner-windows-${{ needs.prepare.outputs.version }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NetPlanner-windows-${{ needs.prepare.outputs.version }}
          path: NetPlanner-windows-${{ needs.prepare.outputs.version }}.zip

  ubuntu:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libfuse2
      - name: Build DEB
        run: |
          VERSION=${{ needs.prepare.outputs.version }} scripts/build_deb.sh
      - name: Build AppImage
        run: |
          scripts/build_appimage.sh
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: NetPlanner-ubuntu-deb-${{ needs.prepare.outputs.version }}
          path: build/deb/*.deb
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: NetPlanner-ubuntu-appimage-${{ needs.prepare.outputs.version }}
          path: NetPlanner-*.AppImage

  macos:
    needs: prepare
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: macos-13
          - arch: arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Build (portable onedir)
        run: |
          pyinstaller --noconfirm --windowed --name NetPlanner \
            --add-data "app/web:app/web" \
            --add-data "app/ui/icons:app/ui/icons" \
            --add-data "app/icon.svg:app/icon.svg" \
            --collect-data PySide6 \
            --collect-data PySide6.QtWebEngineCore \
            --collect-data PySide6.QtWebEngineWidgets \
            --collect-submodules PySide6 \
            --collect-submodules PySide6.QtWebEngineCore \
            --collect-submodules PySide6.QtWebEngineWidgets \
            app/main.py
      - name: Package artifact
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/NetPlanner NetPlanner-macos-${{ matrix.arch }}-${{ needs.prepare.outputs.version }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NetPlanner-macos-${{ matrix.arch }}-${{ needs.prepare.outputs.version }}
          path: NetPlanner-macos-${{ matrix.arch }}-${{ needs.prepare.outputs.version }}.zip

  release:
    needs: [prepare, windows, ubuntu, macos]
    if: >-
      ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
          || (github.event_name == 'pull_request' && github.event.pull_request.merged == true
              && github.event.pull_request.base.ref == 'publish') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          files: |
            artifacts/**/*
