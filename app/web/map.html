<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Map</title>
    <link rel="stylesheet" href="leaflet/leaflet.css" />
    <style>
      html, body, #map { height: 100%; margin: 0; }
      :root {
        --panel-bg: rgba(15, 23, 32, 0.78);
        --panel-border: rgba(255, 255, 255, 0.12);
        --panel-shadow: 0 8px 16px rgba(0,0,0,0.35);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --panel-bg: rgba(255, 255, 255, 0.86);
          --panel-border: rgba(15, 23, 32, 0.12);
          --panel-shadow: 0 8px 16px rgba(0,0,0,0.18);
        }
      }
      .leaflet-container { background: #0f1720; }
      .elevation-tiles { filter: saturate(160%) contrast(140%); }
      .site-marker .site-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid #0f1720;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.4);
      }
      .site-marker .site-icon {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: rgba(15, 23, 32, 0.82);
        border: 1px solid rgba(255,255,255,0.35);
        box-shadow: 0 6px 14px rgba(0,0,0,0.35);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .site-marker .site-icon img {
        width: 24px;
        height: 24px;
        display: block;
        filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6));
      }
      .map-tools,
      .map-instruments {
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        padding: 6px;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        box-shadow: var(--panel-shadow);
        z-index: 1000;
        pointer-events: auto;
      }
      .map-tools .tool-btn,
      .map-instruments .tool-btn {
        width: 28px;
        height: 28px;
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 8px;
        background: rgba(255,255,255,0.1);
        color: #f8fafc;
        font-weight: 700;
        font-size: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12);
      }
      .map-tools .tool-btn img,
      .map-instruments .tool-btn img {
        width: 16px;
        height: 16px;
        display: block;
        filter: drop-shadow(0 1px 2px rgba(0,0,0,0.35));
      }
      .map-tools .tool-btn.active,
      .map-instruments .tool-btn.active {
        background: rgba(34,197,94,0.32);
        border-color: rgba(34,197,94,0.7);
      }
      .map-instruments {
        position: absolute;
        left: 10px;
        top: 55%;
        transform: translateY(-50%);
      }
      .tool-submenu {
        position: absolute;
        display: none;
        flex-direction: column;
        gap: 6px;
        min-width: 180px;
        padding: 10px;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 10px;
        box-shadow: var(--panel-shadow);
        z-index: 2000;
      }
      .tool-submenu-title {
        font-size: 12px;
        font-weight: 700;
        color: #e2e8f0;
        margin-bottom: 4px;
      }
      .tool-submenu-item {
        text-align: left;
        padding: 7px 10px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.32);
        background: rgba(255,255,255,0.16);
        color: #f8fafc;
        cursor: pointer;
        font-size: 12px;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12);
      }
      .tool-submenu-item:hover {
        background: rgba(255,255,255,0.24);
      }
      .map-search {
        position: absolute;
        right: 10px;
        left: auto;
        top: 10px;
        z-index: 2100;
        width: min(420px, calc(100% - 72px));
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 10px;
        box-shadow: var(--panel-shadow);
        padding: 8px;
        pointer-events: auto;
      }
      .map-search-row {
        display: flex;
        gap: 6px;
      }
      .map-search-sources {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 7px;
      }
      .map-search-chip {
        border: 1px solid rgba(255,255,255,0.28);
        border-radius: 999px;
        background: rgba(255,255,255,0.1);
        color: #cbd5e1;
        font-size: 11px;
        line-height: 1;
        padding: 5px 9px;
        cursor: pointer;
      }
      .map-search-chip.active {
        background: rgba(56, 189, 248, 0.25);
        border-color: rgba(56, 189, 248, 0.8);
        color: #f8fafc;
      }
      .map-search-chip:hover {
        background: rgba(255,255,255,0.18);
      }
      .map-search-input {
        flex: 1;
        border: 1px solid rgba(255,255,255,0.28);
        border-radius: 8px;
        background: rgba(255,255,255,0.14);
        color: #f8fafc;
        font-size: 13px;
        padding: 8px 10px;
      }
      .map-search-input::placeholder {
        color: rgba(248,250,252,0.68);
      }
      .map-search-btn {
        border: 1px solid rgba(255,255,255,0.28);
        border-radius: 8px;
        background: rgba(255,255,255,0.16);
        color: #f8fafc;
        font-size: 12px;
        padding: 8px 10px;
        cursor: pointer;
      }
      .map-search-btn:hover {
        background: rgba(255,255,255,0.24);
      }
      .map-search-results {
        margin-top: 6px;
        max-height: 220px;
        overflow-y: auto;
        display: none;
      }
      .map-search-item {
        width: 100%;
        text-align: left;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 8px;
        background: rgba(255,255,255,0.1);
        color: #f8fafc;
        padding: 7px 9px;
        margin: 0 0 5px 0;
        cursor: pointer;
      }
      .map-search-item:hover {
        background: rgba(255,255,255,0.18);
      }
      .map-search-item-title {
        font-size: 12px;
        font-weight: 700;
      }
      .map-search-item-sub {
        margin-top: 2px;
        font-size: 11px;
        opacity: 0.85;
      }
      .map-search-item-meta {
        margin-top: 4px;
        display: flex;
        justify-content: flex-end;
      }
      .map-search-source-badge {
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 10px;
        line-height: 1.2;
        color: #e2e8f0;
        background: rgba(255,255,255,0.09);
      }
      .map-search-empty {
        font-size: 12px;
        opacity: 0.85;
        color: #f8fafc;
        padding: 6px 4px;
      }
      .map-search-feedback {
        margin-top: 6px;
        font-size: 11px;
        color: #fca5a5;
        display: none;
      }
      .map-shortcuts-overlay {
        position: absolute;
        right: 12px;
        top: 72px;
        z-index: 2200;
        width: min(320px, calc(100% - 24px));
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 10px;
        box-shadow: var(--panel-shadow);
        padding: 10px 12px;
        color: #f8fafc;
        display: none;
      }
      .map-shortcuts-title {
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .map-shortcuts-item {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 12px;
        padding: 3px 0;
      }
      .map-shortcuts-key {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        border: 1px solid rgba(255,255,255,0.28);
        border-radius: 6px;
        padding: 1px 6px;
        white-space: nowrap;
      }
      .map-shortcuts-note {
        margin-top: 8px;
        font-size: 11px;
        opacity: 0.85;
      }
      @media (prefers-color-scheme: light) {
        .tool-submenu-title { color: #0f1720; }
        .tool-submenu-item { color: #0f1720; border-color: rgba(15,23,32,0.2); }
        .map-search-input,
        .map-search-btn,
        .map-search-item,
        .map-search-chip,
        .map-search-source-badge {
          color: #0f1720;
          border-color: rgba(15,23,32,0.2);
        }
        .map-search-chip {
          background: rgba(15,23,32,0.04);
        }
        .map-search-chip.active {
          background: rgba(14, 165, 233, 0.3);
          border-color: rgba(3, 105, 161, 0.9);
          color: #082f49;
          font-weight: 600;
        }
        .map-search-chip:hover {
          background: rgba(14, 165, 233, 0.18);
        }
        .map-search-empty { color: #0f1720; }
        .map-search-feedback { color: #b91c1c; }
        .map-search-input::placeholder { color: rgba(15,23,32,0.55); }
        .map-shortcuts-overlay { color: #0f1720; }
        .map-shortcuts-key { border-color: rgba(15,23,32,0.2); }
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script src="leaflet/leaflet.js"></script>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script>
      const map = L.map('map', { zoomControl: true }).setView([50.45, 30.52], 11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
      const elevationLayer = L.tileLayer(
        'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png',
        { maxZoom: 15, opacity: 0.65, className: 'elevation-tiles' }
      );

      const toolsControl = L.control({ position: 'bottomleft' });
      toolsControl.onAdd = function () {
        const div = L.DomUtil.create('div', 'map-tools');
        div.innerHTML = `
          <button id="tool-elevation" class="tool-btn" title="Шар висот"><img src="../ui/icons/elevation.png" alt="Elevation"></button>
          <button id="tool-coverage" class="tool-btn" title="Покриття"><img src="../ui/icons/coverage.png" alt="Coverage"></button>
          <button id="tool-link-labels" class="tool-btn" title="Лейбли лінків"><img src="../ui/icons/labels.png" alt="Link labels"></button>
        `;
        L.DomEvent.disableClickPropagation(div);
        return div;
      };
      toolsControl.addTo(map);

      const instrumentsContainer = L.DomUtil.create('div', 'map-instruments', map.getContainer());
      instrumentsContainer.innerHTML = `
        <button id="tool-height" class="tool-btn" title="Визначити висоту"><img src="../ui/icons/altitude.png" alt="Altitude"></button>
        <button id="tool-azimuth" class="tool-btn" title="Азимут"><img src="../ui/icons/azimuth.png" alt="Azimuth"></button>
        <button id="tool-ruler" class="tool-btn" title="Лінійка"><img src="../ui/icons/ruler.png" alt="Ruler"></button>
        <button id="tool-los" class="tool-btn" title="LOS"><img src="../ui/icons/los.png" alt="LOS"></button>
        <button id="tool-calculators" class="tool-btn" title="Калькулятори"><img src="../ui/icons/eirp.png" alt="Calculators"></button>
      `;
      L.DomEvent.disableClickPropagation(instrumentsContainer);

      const searchContainer = L.DomUtil.create('div', 'map-search', map.getContainer());
      searchContainer.innerHTML = `
        <div class="map-search-row">
          <input id="map-search-input" class="map-search-input" type="text" placeholder="Пошук" />
          <button id="map-search-run" class="map-search-btn" type="button">Пошук</button>
          <button id="map-search-clear" class="map-search-btn" type="button">Очистити</button>
        </div>
        <div id="map-search-sources" class="map-search-sources">
          <button class="map-search-chip active" type="button" data-source="local">Локально</button>
          <button class="map-search-chip active" type="button" data-source="online">Онлайн</button>
        </div>
        <div id="map-search-feedback" class="map-search-feedback"></div>
        <div id="map-search-results" class="map-search-results"></div>
      `;
      L.DomEvent.disableClickPropagation(searchContainer);

      const shortcutsOverlay = L.DomUtil.create('div', 'map-shortcuts-overlay', map.getContainer());
      shortcutsOverlay.id = 'map-shortcuts-overlay';
      shortcutsOverlay.innerHTML = `
        <div class="map-shortcuts-title">Гарячі клавіші</div>
        <div class="map-shortcuts-item"><span>/</span><span class="map-shortcuts-key">Пошук</span></div>
        <div class="map-shortcuts-item"><span>Ctrl+F</span><span class="map-shortcuts-key">Пошук</span></div>
        <div class="map-shortcuts-item"><span>A</span><span class="map-shortcuts-key">Азимут</span></div>
        <div class="map-shortcuts-item"><span>R</span><span class="map-shortcuts-key">Лінійка</span></div>
        <div class="map-shortcuts-item"><span>L</span><span class="map-shortcuts-key">LOS</span></div>
        <div class="map-shortcuts-item"><span>H</span><span class="map-shortcuts-key">Висота</span></div>
        <div class="map-shortcuts-item"><span>Esc</span><span class="map-shortcuts-key">Вимкнути режими</span></div>
        <div class="map-shortcuts-item"><span>?</span><span class="map-shortcuts-key">Ця довідка</span></div>
      `;
      L.DomEvent.disableClickPropagation(shortcutsOverlay);

      map.createPane('coveragePane');
      map.getPane('coveragePane').style.zIndex = 250;

      const markers = new Map();
      const links = new Map();
      const coverages = new Map();
      const coverageLayer = L.layerGroup({ pane: 'coveragePane' }).addTo(map);
      let bridge = null;
      let linkMode = false;
      let heightMode = false;
      let losMode = false;
      let losStart = null;
      let losTemp = null;
      let azimuthMode = false;
      let rulerMode = false;
      let rulerStopped = false;
      let rulerStart = null;
      let rulerTemp = null;
      let rulerTooltip = null;
      let rulerTotalLabel = null;
      let rulerTotalKm = 0;
      const rulerSegments = [];
      let azimuthStart = null;
      let azimuthTemp = null;
      let azimuthTooltip = null;
      let azimuthMeasureId = 1;
      const azimuthMeasures = new Map();
      const MAX_AZIMUTH_DISTANCE_KM = 50;
      const MAX_AZIMUTH_MEASURES = 30;
      const AZIMUTH_MOUSEMOVE_MS = 50;
      let azimuthLastRenderTs = 0;
      let horizonLayer = null;
      let elevationEnabled = false;
      let coverageEnabled = true;
      let coverageSuppressed = false;
      let linkLabelsVisible = true;
      let dragLine = null;
      let dragTooltip = null;
      let dragSourceId = null;
      let hoverTargetId = null;
      let calculatorsMenu = null;
      let searchPin = null;
      const searchSourceState = {
        local: true,
        online: true,
      };
      let lastSearchQuery = '';
      let lastSearchSources = [];

      function ensureCalculatorsMenu() {
        if (calculatorsMenu) { return; }
        calculatorsMenu = document.createElement('div');
        calculatorsMenu.className = 'tool-submenu';
        calculatorsMenu.innerHTML = `
          <div class="tool-submenu-title">Калькулятори</div>
          <button class="tool-submenu-item" id="calc-eirp">Калькулятор EIRP</button>
          <button class="tool-submenu-item" id="calc-horizon">Калькулятор горизонту</button>
          <button class="tool-submenu-item" id="calc-power">Вт ↔ dBm</button>
          <button class="tool-submenu-item" id="calc-frequency">кГц ↔ МГц ↔ ГГц</button>
        `;
        map.getContainer().appendChild(calculatorsMenu);
        const eirpBtn = calculatorsMenu.querySelector('#calc-eirp');
        if (eirpBtn) {
          eirpBtn.onclick = (evt) => {
            evt.stopPropagation();
            hideCalculatorsMenu();
            if (bridge && bridge.openEirpCalculator) {
              bridge.openEirpCalculator();
            }
          };
        }
        const horizonBtn = calculatorsMenu.querySelector('#calc-horizon');
        if (horizonBtn) {
          horizonBtn.onclick = (evt) => {
            evt.stopPropagation();
            hideCalculatorsMenu();
            if (bridge && bridge.openHorizonCalculator) {
              bridge.openHorizonCalculator();
            }
          };
        }
        const powerBtn = calculatorsMenu.querySelector('#calc-power');
        if (powerBtn) {
          powerBtn.onclick = (evt) => {
            evt.stopPropagation();
            hideCalculatorsMenu();
            if (bridge && bridge.openPowerCalculator) {
              bridge.openPowerCalculator();
            }
          };
        }
        const frequencyBtn = calculatorsMenu.querySelector('#calc-frequency');
        if (frequencyBtn) {
          frequencyBtn.onclick = (evt) => {
            evt.stopPropagation();
            hideCalculatorsMenu();
            if (bridge && bridge.openFrequencyCalculator) {
              bridge.openFrequencyCalculator();
            }
          };
        }
        calculatorsMenu.addEventListener('click', (evt) => evt.stopPropagation());
      }

      function showCalculatorsMenu(anchor) {
        ensureCalculatorsMenu();
        const rect = anchor.getBoundingClientRect();
        const containerRect = map.getContainer().getBoundingClientRect();
        const left = rect.right - containerRect.left + 8;
        calculatorsMenu.style.left = `${left}px`;
        calculatorsMenu.style.display = 'flex';
        calculatorsMenu.style.visibility = 'hidden';
        const menuHeight = calculatorsMenu.offsetHeight || 0;
        const menuWidth = calculatorsMenu.offsetWidth || 0;
        let top = rect.top - containerRect.top - (menuHeight - rect.height) / 2;
        const maxTop = containerRect.height - menuHeight - 8;
        const maxLeft = containerRect.width - menuWidth - 8;
        top = Math.max(8, Math.min(top, maxTop));
        const clampedLeft = Math.max(8, Math.min(left, maxLeft));
        calculatorsMenu.style.left = `${clampedLeft}px`;
        calculatorsMenu.style.top = `${top}px`;
        calculatorsMenu.style.visibility = 'visible';
      }

      function hideCalculatorsMenu() {
        if (!calculatorsMenu) { return; }
        calculatorsMenu.style.display = 'none';
      }

      function toggleCalculatorsMenu(anchor) {
        ensureCalculatorsMenu();
        if (calculatorsMenu.style.display === 'flex') {
          hideCalculatorsMenu();
        } else {
          showCalculatorsMenu(anchor);
        }
      }

      function ensureBridgeReady(cb) {
        if (bridge) { cb(); return; }
        if (window.qt && window.qt.webChannelTransport) {
          new QWebChannel(window.qt.webChannelTransport, (channel) => {
            bridge = channel.objects.bridge;
            cb();
          });
        }
      }

      function getActiveSearchSources() {
        return Object.keys(searchSourceState).filter((key) => !!searchSourceState[key]);
      }

      function setSearchFeedback(message) {
        const feedbackEl = document.getElementById('map-search-feedback');
        if (!feedbackEl) { return; }
        const text = (message || '').trim();
        if (!text) {
          feedbackEl.textContent = '';
          feedbackEl.style.display = 'none';
          return;
        }
        feedbackEl.textContent = text;
        feedbackEl.style.display = 'block';
      }

      function looksLikeMgrsCandidate(query) {
        const token = (query || '').trim().toUpperCase().replace(/\s+/g, '');
        if (!token) { return false; }
        return /^[0-9]{1,2}[A-Z]{3,}[0-9A-Z]*$/.test(token);
      }

      function syncSearchSourceChips() {
        const chips = document.querySelectorAll('.map-search-chip[data-source]');
        chips.forEach((chip) => {
          const key = (chip.dataset.source || '').toLowerCase();
          chip.classList.toggle('active', !!searchSourceState[key]);
        });
      }

      function focusSearchInput(selectAll) {
        const input = document.getElementById('map-search-input');
        if (!input) { return; }
        input.focus({ preventScroll: true });
        if (selectAll) {
          input.select();
        }
        setShortcutsOverlayVisible(false);
      }

      function setShortcutsOverlayVisible(visible) {
        if (!shortcutsOverlay) { return; }
        shortcutsOverlay.style.display = visible ? 'block' : 'none';
      }

      function toggleShortcutsOverlay() {
        if (!shortcutsOverlay) { return; }
        const isVisible = shortcutsOverlay.style.display === 'block';
        setShortcutsOverlayVisible(!isVisible);
      }

      function isTextInputTarget(target) {
        if (!target) { return false; }
        const tag = (target.tagName || '').toUpperCase();
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
          return true;
        }
        return !!target.isContentEditable;
      }

      function triggerToolShortcut(code) {
        const shortcutMap = {
          KeyA: 'tool-azimuth',
          KeyR: 'tool-ruler',
          KeyL: 'tool-los',
          KeyH: 'tool-height',
        };
        const buttonId = shortcutMap[code];
        if (!buttonId) { return false; }
        const button = document.getElementById(buttonId);
        if (!button) { return false; }
        button.click();
        return true;
      }

      function bindSearchControls() {
        const input = document.getElementById('map-search-input');
        const runBtn = document.getElementById('map-search-run');
        const clearBtn = document.getElementById('map-search-clear');
        const sourcesWrap = document.getElementById('map-search-sources');
        if (!input || !runBtn || !clearBtn) { return; }

        const submitSearch = () => {
          const query = input.value.trim();
          lastSearchQuery = query;
          if (!query) {
            setSearchFeedback('');
            showSearchResults([]);
            return;
          }
          const activeSources = getActiveSearchSources();
          lastSearchSources = activeSources.slice();
          if (!activeSources.length) {
            setSearchFeedback('Оберіть хоча б одне джерело пошуку.');
            showSearchResults([]);
            return;
          }
          setSearchFeedback('');
          if (bridge && bridge.searchMapWithSources) {
            bridge.searchMapWithSources(query, JSON.stringify(activeSources));
            return;
          }
          if (bridge && bridge.searchMap) {
            bridge.searchMap(query);
          }
        };

        runBtn.onclick = (evt) => {
          evt.stopPropagation();
          submitSearch();
        };
        clearBtn.onclick = (evt) => {
          evt.stopPropagation();
          clearSearchUI(true);
        };
        input.addEventListener('keydown', (evt) => {
          if (evt.key !== 'Enter') { return; }
          evt.preventDefault();
          submitSearch();
        });
        if (sourcesWrap) {
          const chips = sourcesWrap.querySelectorAll('.map-search-chip[data-source]');
          chips.forEach((chip) => {
            chip.addEventListener('click', (evt) => {
              evt.stopPropagation();
              const key = (chip.dataset.source || '').toLowerCase();
              if (!(key in searchSourceState)) { return; }
              searchSourceState[key] = !searchSourceState[key];
              syncSearchSourceChips();
              if (input.value.trim()) {
                submitSearch();
              }
            });
          });
        }
        syncSearchSourceChips();
      }

      function bindKeyboardShortcuts() {
        document.addEventListener('keydown', (evt) => {
          const code = evt.code || '';
          const isCtrlF = (evt.ctrlKey || evt.metaKey) && code === 'KeyF';
          const isSlash = code === 'Slash' && !evt.shiftKey && !evt.altKey && !evt.ctrlKey && !evt.metaKey;
          const isQuestion = code === 'Slash' && evt.shiftKey && !evt.altKey && !evt.ctrlKey && !evt.metaKey;
          const isEsc = evt.key === 'Escape';
          const typing = isTextInputTarget(evt.target);

          if (isCtrlF) {
            evt.preventDefault();
            focusSearchInput(true);
            return;
          }

          if (isQuestion && !typing) {
            evt.preventDefault();
            toggleShortcutsOverlay();
            return;
          }

          if (isSlash && !typing) {
            evt.preventDefault();
            focusSearchInput(true);
            return;
          }

          if (typing) {
            return;
          }

          if (isEsc) {
            if (shortcutsOverlay && shortcutsOverlay.style.display === 'block') {
              evt.preventDefault();
              setShortcutsOverlayVisible(false);
              return;
            }
            const resultsEl = document.getElementById('map-search-results');
            const feedbackEl = document.getElementById('map-search-feedback');
            const hasVisibleResults = !!resultsEl && resultsEl.style.display === 'block';
            const hasFeedback = !!feedbackEl && feedbackEl.style.display === 'block';
            if (hasVisibleResults || hasFeedback) {
              evt.preventDefault();
              clearSearchUI(false);
              return;
            }
            return;
          }

          if (evt.repeat) {
            return;
          }

          if (triggerToolShortcut(code)) {
            evt.preventDefault();
          }
        });
      }

      function clearSearchUI(clearInput) {
        const input = document.getElementById('map-search-input');
        if (clearInput && input) {
          input.value = '';
        }
        lastSearchQuery = '';
        lastSearchSources = [];
        setSearchFeedback('');
        showSearchResults([]);
        if (searchPin) {
          map.removeLayer(searchPin);
          searchPin = null;
        }
      }

      function focusSearchResult(item) {
        if (!item || !Number.isFinite(item.lat) || !Number.isFinite(item.lon)) { return; }
        const zoom = Number.isFinite(item.zoom) ? item.zoom : 14;
        map.setView([item.lat, item.lon], zoom);
        if (searchPin) {
          map.removeLayer(searchPin);
        }
        searchPin = L.circleMarker([item.lat, item.lon], {
          radius: 7,
          color: '#0ea5e9',
          fillColor: '#38bdf8',
          fillOpacity: 0.8,
          weight: 2,
        }).addTo(map);
        if (item.site_id && bridge && bridge.selectNode) {
          bridge.selectNode(item.site_id);
        }
      }

      function showSearchResults(results) {
        const resultsEl = document.getElementById('map-search-results');
        if (!resultsEl) { return; }
        const items = Array.isArray(results) ? results : [];
        resultsEl.innerHTML = '';
        if (!items.length) {
          resultsEl.style.display = 'none';
          const onlineEnabled = lastSearchSources.includes('online');
          if (onlineEnabled && looksLikeMgrsCandidate(lastSearchQuery)) {
            setSearchFeedback('MGRS не розпізнано.');
          } else {
            setSearchFeedback('');
          }
          return;
        }
        setSearchFeedback('');
        items.forEach((item) => {
          if (!item || !Number.isFinite(item.lat) || !Number.isFinite(item.lon)) { return; }
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'map-search-item';
          const title = (item.title || 'Результат').toString();
          const subtitle = (item.subtitle || '').toString();
          const sourceLabel = (item.source_label || '').toString();
          const titleEl = document.createElement('div');
          titleEl.className = 'map-search-item-title';
          titleEl.textContent = title;
          const subEl = document.createElement('div');
          subEl.className = 'map-search-item-sub';
          subEl.textContent = subtitle;
          btn.appendChild(titleEl);
          btn.appendChild(subEl);
          if (sourceLabel) {
            const metaEl = document.createElement('div');
            metaEl.className = 'map-search-item-meta';
            const sourceEl = document.createElement('span');
            sourceEl.className = 'map-search-source-badge';
            sourceEl.textContent = sourceLabel;
            metaEl.appendChild(sourceEl);
            btn.appendChild(metaEl);
          }
          btn.onclick = (evt) => {
            evt.stopPropagation();
            focusSearchResult(item);
          };
          resultsEl.appendChild(btn);
        });
        if (!resultsEl.children.length) {
          const empty = document.createElement('div');
          empty.className = 'map-search-empty';
          empty.textContent = 'Нічого не знайдено';
          resultsEl.appendChild(empty);
        }
        resultsEl.style.display = 'block';
      }

      function ensureHorizonLayer() {
        if (horizonLayer) { return; }
        horizonLayer = L.layerGroup().addTo(map);
      }

      function addHorizonPoint(lat, lon) {
        ensureHorizonLayer();
        const marker = L.circleMarker([lat, lon], {
          radius: 5,
          color: '#2563eb',
          weight: 2,
          fillColor: '#60a5fa',
          fillOpacity: 0.9,
        });
        marker.addTo(horizonLayer);
      }

      function clearHorizonPoints() {
        if (!horizonLayer) { return; }
        horizonLayer.clearLayers();
      }

      function bindToolButtons() {
        const el = document.getElementById('tool-elevation');
        const cov = document.getElementById('tool-coverage');
        const linkLbl = document.getElementById('tool-link-labels');
        const h = document.getElementById('tool-height');
        const a = document.getElementById('tool-azimuth');
        const r = document.getElementById('tool-ruler');
        const l = document.getElementById('tool-los');
        const c = document.getElementById('tool-calculators');
        if (el) {
          el.onclick = () => {
            setElevationVisible(!elevationEnabled);
          };
        }
        if (cov) {
          cov.onclick = () => {
            setCoverageVisible(!coverageEnabled);
          };
        }
        if (linkLbl) {
          linkLbl.onclick = () => {
            setLinkLabelsVisible(!linkLabelsVisible);
          };
        }
        if (h) {
          h.onclick = () => {
            if (bridge && bridge.setHeightMode) {
              bridge.setHeightMode(!heightMode);
            } else {
              setAzimuthMode(false);
              setRulerMode(false);
              setLosMode(false);
              setHeightMode(!heightMode);
            }
          };

          a.onclick = () => {
            if (bridge && bridge.setAzimuthMode) {
              bridge.setAzimuthMode(!azimuthMode);
            } else {
              setHeightMode(false);
              setRulerMode(false);
              setLosMode(false);
              setAzimuthMode(!azimuthMode);
            }
          };
        }
        if (r) {
          r.onclick = () => {
            if (bridge && bridge.setRulerMode) {
              bridge.setRulerMode(!rulerMode);
            } else {
              setHeightMode(false);
              setAzimuthMode(false);
              setLosMode(false);
              setRulerMode(!rulerMode);
            }
          };
        }
        if (l) {
          l.onclick = () => {
            setHeightMode(false);
            setAzimuthMode(false);
            setRulerMode(false);
            hideCalculatorsMenu();
            if (bridge && bridge.setLosMode) {
              bridge.setLosMode(!losMode);
            } else {
              setLosMode(!losMode);
            }
          };
        }
        if (c) {
          c.onclick = (evt) => {

      map.on('click', () => {
        hideCalculatorsMenu();
        setShortcutsOverlayVisible(false);
      });

      function siteIconUrl(kind, status) {
        const kindKey = (kind || 'core').toString().toLowerCase();
        let statusKey = (status || 'unknown').toString().toLowerCase();
        if (statusKey === 'unknown') {
          statusKey = 'degraded';
        }
        const safeKind = ['core', 'pop', 'cpe'].includes(kindKey) ? kindKey : 'core';
        const safeStatus = ['up', 'down', 'degraded'].includes(statusKey) ? statusKey : 'degraded';
        return `../ui/icons/map_view/${safeKind}_${safeStatus}.png`;
      }

      function markerIcon(kind, status) {
        const url = siteIconUrl(kind, status);
        return L.divIcon({
          className: 'site-marker',
          html: `<div class="site-icon"><img src="${url}" alt="" /></div>`,
          iconSize: [30, 30],
          iconAnchor: [15, 15],
        });
      }

      function addMarker(id, name, kind, lat, lon) {
        const marker = L.marker([lat, lon], { draggable: true, icon: markerIcon(kind, 'unknown') });
        marker._kind = kind;
        marker._status = 'unknown';
        marker.addTo(map);
        marker.bindPopup(`${name} (${kind})`);
        marker.bindTooltip(name, { direction: 'top' });
        marker.on('click', () => {
          if (bridge) { bridge.selectNode(id); }
        });
        marker.on('dblclick', () => {
          if (bridge) { bridge.openSite(id); }
        });
        marker.on('contextmenu', (e) => {
          if (bridge) { bridge.showSiteMenu(id, e.originalEvent.clientX, e.originalEvent.clientY); }
        });
        marker.on('mouseover', () => { hoverTargetId = id; });
        marker.on('mouseout', () => { if (hoverTargetId === id) { hoverTargetId = null; } });
        marker.on('mousedown', (e) => {
          if (!linkMode) { return; }
          dragSourceId = id;
          const start = marker.getLatLng();
          dragLine = L.polyline([start, start], { color: '#6b7280', dashArray: '6 6' }).addTo(map);
          map.dragging.disable();
        });
        marker.on('dragstart', (e) => {
          const pos = e.target.getLatLng();
          marker._prevLatLng = { lat: pos.lat, lng: pos.lng };
        });
        marker.on('dragend', (e) => {
          const pos = e.target.getLatLng();
          const prev = marker._prevLatLng || { lat: pos.lat, lng: pos.lng };
          if (bridge) { bridge.requestMoveNode(id, pos.lat, pos.lng, prev.lat, prev.lng); }
        });
        markers.set(id, marker);
      }

      function moveMarker(id, lat, lon) {
        const marker = markers.get(id);
        if (!marker) { return; }
        marker.setLatLng([lat, lon]);
      }

      function updateMarkerLabel(id, name, kind) {
        const marker = markers.get(id);
        if (!marker) { return; }
        marker._kind = kind;
        marker.bindPopup(`${name} (${kind})`);
        marker.bindTooltip(name, { direction: 'top' });
        marker.setIcon(markerIcon(marker._kind, marker._status));
      }

      function setMarkerStatus(id, status) {
        const marker = markers.get(id);
        if (!marker) { return; }
        marker._status = status;
        marker.setIcon(markerIcon(marker._kind, status));
      }

      function removeMarker(id) {
        const marker = markers.get(id);
        if (!marker) { return; }
        map.removeLayer(marker);
        markers.delete(id);
      }

      function addCoverage(id, lat, lon, azimuth, beamwidth, rangeKm, color) {
        const polygon = buildCoveragePolygon(lat, lon, azimuth, beamwidth, rangeKm);
        if (!polygon) { return; }
        polygon.setStyle({ color: color, fillColor: color });
        polygon.addTo(coverageLayer);
        coverages.set(id, [polygon]);
      }

      function clearCoverageEntry(entry) {
        if (!entry) { return; }
        if (Array.isArray(entry)) {
          entry.forEach((layer) => coverageLayer.removeLayer(layer));
        } else {
          coverageLayer.removeLayer(entry);
        }
      }

      function clearCoverages() {
        coverages.forEach((entry) => clearCoverageEntry(entry));
        coverages.clear();
      }

      function updateCoverage(id, lat, lon, azimuth, beamwidth, rangeKm, color, tooltip) {
        const existing = coverages.get(id);
        if (existing) {
          clearCoverageEntry(existing);
          coverages.delete(id);
        }
        addCoverage(id, lat, lon, azimuth, beamwidth, rangeKm, color);
        if (tooltip) {
          const entry = coverages.get(id);
          if (entry && entry.length > 0) {
            entry[0].bindTooltip(tooltip);
          }
        }
      }

      function updateCoveragePoints(id, latlngs, color, tooltip) {
        const existing = coverages.get(id);
        if (existing) {
          clearCoverageEntry(existing);
          coverages.delete(id);
        }
        const newPoly = L.polygon(latlngs, { color: color, fillColor: color, fillOpacity: 0.15 });
        if (tooltip) { newPoly.bindTooltip(tooltip); }
        newPoly.addTo(coverageLayer);
        coverages.set(id, [newPoly]);
      }

      function updateCoverageBands(id, bands, tooltip) {
        const existing = coverages.get(id);
        if (existing) {
          clearCoverageEntry(existing);
        }
        const polys = [];
        bands.forEach((band) => {
          const poly = L.polygon(band.latlngs, {
            color: band.color,
            fillColor: band.color,
            fillOpacity: 0.2,
            weight: 1,
          });
          if (tooltip) { poly.bindTooltip(tooltip); }
          poly.addTo(coverageLayer);
          polys.push(poly);
        });
        coverages.set(id, polys);
      }

      function updateCoverageRasterTile(id, dataUrl, bounds) {
        let existing = coverages.get(id);
        if (existing && !Array.isArray(existing)) {
          coverageLayer.removeLayer(existing);
          existing = null;
        }
        if (!existing) {
          existing = [];
          coverages.set(id, existing);
        }
        const latLngBounds = Array.isArray(bounds[0])
          ? bounds
          : [[bounds[0], bounds[1]], [bounds[2], bounds[3]]];
        const overlay = L.imageOverlay(dataUrl, latLngBounds, { opacity: 1, pane: 'coveragePane' });
        overlay.addTo(coverageLayer);
        existing.push(overlay);
      }

      function updateCoverageRasterTiles(id, tiles) {
        if (!Array.isArray(tiles) || tiles.length === 0) { return; }
        let existing = coverages.get(id);
        if (existing && !Array.isArray(existing)) {
          coverageLayer.removeLayer(existing);
          existing = null;
        }
        if (!existing) {
          existing = [];
          coverages.set(id, existing);
        }
        tiles.forEach((tile) => {
          if (!tile || !tile.data_url || !tile.bounds) { return; }
          const bounds = tile.bounds;
          const latLngBounds = Array.isArray(bounds[0])
            ? bounds
            : [[bounds[0], bounds[1]], [bounds[2], bounds[3]]];
          const overlay = L.imageOverlay(tile.data_url, latLngBounds, { opacity: 1, pane: 'coveragePane' });
          overlay.addTo(coverageLayer);
          existing.push(overlay);
        });
      }

      function removeCoverage(id) {
        const entry = coverages.get(id);
        if (!entry) { return; }
        clearCoverageEntry(entry);
        coverages.delete(id);
      }

      function setCoverageVisible(enabled) {
        coverageEnabled = !!enabled;
        updateToolStates();
        if (enabled && !coverageSuppressed) {
          coverageLayer.addTo(map);
        } else {
          map.removeLayer(coverageLayer);
        }
      }

      function updateToolStates() {
        const el = document.getElementById('tool-elevation');
        const cov = document.getElementById('tool-coverage');
        const linkLbl = document.getElementById('tool-link-labels');
        if (el) { el.classList.toggle('active', elevationEnabled); }
        if (cov) { cov.classList.toggle('active', coverageEnabled); }
        if (linkLbl) { linkLbl.classList.toggle('active', linkLabelsVisible); }
      }

      function updateInstrumentStates() {
        const h = document.getElementById('tool-height');
        const a = document.getElementById('tool-azimuth');
        const r = document.getElementById('tool-ruler');
        const l = document.getElementById('tool-los');
        if (h) { h.classList.toggle('active', heightMode); }
        if (a) { a.classList.toggle('active', azimuthMode); }
        if (r) { r.classList.toggle('active', rulerMode); }
        if (l) { l.classList.toggle('active', losMode); }
      }

      function buildCoverageLatLngs(lat, lon, azimuth, beamwidth, rangeKm) {
        if (beamwidth <= 0 || rangeKm <= 0) { return null; }
        const points = [];
        const center = L.latLng(lat, lon);
        const start = azimuth - beamwidth / 2;
        const end = azimuth + beamwidth / 2;
        for (let angle = start; angle <= end; angle += Math.max(1, beamwidth / 24)) {
          points.push(destinationPoint(center, angle, rangeKm));
        }
        points.unshift(center);
        points.push(center);
        return points;
      }

      function buildCoveragePolygon(lat, lon, azimuth, beamwidth, rangeKm) {
        const latlngs = buildCoverageLatLngs(lat, lon, azimuth, beamwidth, rangeKm);
        if (!latlngs) { return null; }
        return L.polygon(latlngs, { color: '#22c55e', fillColor: '#22c55e', fillOpacity: 0.15 });
      }

      function destinationPoint(start, bearing, distanceKm) {
        const R = 6371.0;
        const brng = bearing * Math.PI / 180;
        const d = distanceKm / R;
        const lat1 = start.lat * Math.PI / 180;
        const lon1 = start.lng * Math.PI / 180;
        const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(brng));
        const lon2 = lon1 + Math.atan2(Math.sin(brng) * Math.sin(d) * Math.cos(lat1), Math.cos(d) - Math.sin(lat1) * Math.sin(lat2));
        return L.latLng(lat2 * 180 / Math.PI, lon2 * 180 / Math.PI);
      }

      function addLink(id, label, kind, info, distanceKm, latA, lonA, latB, lonB) {
        const color = kind === 'ptp' ? '#2563eb' : (kind === 'ptmp' ? '#10b981' : '#f97316');
        const line = L.polyline([[latA, lonA], [latB, lonB]], { color: color, weight: 3 });
        line.addTo(map);
        const labelText = label;
        line.bindTooltip(labelText, { permanent: true, direction: 'center' });
        if (!linkLabelsVisible) {
          line.unbindTooltip();
        }
        line.on('click', (e) => {
          if (bridge) { bridge.selectLink(id); }
          if (bridge) { bridge.showLinkMenu(id, e.originalEvent.clientX, e.originalEvent.clientY); }
        });
        line.on('mouseover', (e) => {
          const entry = links.get(id);
          if (!entry) { return; }
          if (entry.distanceTooltip) { map.removeLayer(entry.distanceTooltip); entry.distanceTooltip = null; }
          if (entry.distanceKm) {
            entry.distanceTooltip = L.tooltip({ direction: 'top', offset: [0, -8], opacity: 0.9 })
              .setLatLng(e.latlng)
              .setContent(`${entry.distanceKm.toFixed(2)} км`);
            entry.distanceTooltip.addTo(map);
          }
          entry.timer = setTimeout(() => {
            entry.popup = L.popup({ closeButton: false, autoClose: false })
              .setLatLng(e.latlng)
              .setContent(info || '');
            entry.popup.openOn(map);
          }, 1500);
        });
        line.on('mouseout', () => {
          const entry = links.get(id);
          if (!entry) { return; }
          if (entry.timer) { clearTimeout(entry.timer); entry.timer = null; }
          if (entry.popup) { map.closePopup(entry.popup); entry.popup = null; }
          if (entry.distanceTooltip) { map.removeLayer(entry.distanceTooltip); entry.distanceTooltip = null; }
        });
        links.set(id, { line, info, timer: null, popup: null, label, distanceKm, distanceTooltip: null });
      }

      function updateLink(id, latA, lonA, latB, lonB) {
        const entry = links.get(id);
        if (!entry) { return; }
        entry.line.setLatLngs([[latA, lonA], [latB, lonB]]);
      }

      function updateLinkMeta(id, label, kind, info, distanceKm) {
        const entry = links.get(id);
        if (!entry) { return; }
        const color = kind === 'ptp' ? '#2563eb' : (kind === 'ptmp' ? '#10b981' : '#f97316');
        entry.line.setStyle({ color: color });
        const tooltip = entry.line.getTooltip();
        const labelText = label;
        if (tooltip) { tooltip.setContent(labelText); }
        entry.info = info;
        entry.label = label;
        entry.distanceKm = distanceKm;
      }

      function setLinkLabelsVisible(enabled) {
        linkLabelsVisible = !!enabled;
        links.forEach((entry) => {
          if (linkLabelsVisible) {
            if (!entry.line.getTooltip()) {
              entry.line.bindTooltip(entry.label, { permanent: true, direction: 'center' });
            }
          } else {
            if (entry.line.getTooltip()) {
              entry.line.unbindTooltip();
            }
          }
        });
        updateToolStates();
      }

      function removeLink(id) {
        const entry = links.get(id);
        if (!entry) { return; }
        if (entry.timer) { clearTimeout(entry.timer); entry.timer = null; }
        if (entry.popup) { map.closePopup(entry.popup); entry.popup = null; }
        if (entry.distanceTooltip) { map.removeLayer(entry.distanceTooltip); entry.distanceTooltip = null; }
        map.removeLayer(entry.line);
        links.delete(id);
      }

      function focusMarker(id) {
        const marker = markers.get(id);
        if (!marker) { return; }
        marker.openPopup();
        map.panTo(marker.getLatLng());
      }

      function setLinkMode(value) {
        linkMode = !!value;
      }

      function setHeightMode(value) {
        heightMode = !!value;
        updateInstrumentStates();
      }

      function setLosMode(value) {
        losMode = !!value;
        resetLosTemp();
        updateInstrumentStates();
      }

      function resetLosTemp() {
        if (losTemp) {
          map.removeLayer(losTemp);
          losTemp = null;
        }
        losStart = null;
      }

      function updateLosTemp(latlng) {
        if (!losStart || !latlng) { return; }
        if (!losTemp) {
          losTemp = L.polyline([losStart, latlng], { color: '#f97316', weight: 2, dashArray: '6 6' });
          losTemp.addTo(map);
        } else {
          losTemp.setLatLngs([losStart, latlng]);
        }
      }

      function setAzimuthMode(value) {
        azimuthMode = !!value;
        resetAzimuthTemp();
        updateInstrumentStates();
      }

      function setRulerMode(value) {
        rulerMode = !!value;
        rulerStopped = false;
        resetRuler();
        updateInstrumentStates();
      }

      function resetAzimuthTemp() {
        if (azimuthTemp) {
          azimuthTemp.layers.forEach((layer) => map.removeLayer(layer));
          azimuthTemp = null;
        }
        if (azimuthTooltip) {
          map.closeTooltip(azimuthTooltip);
          azimuthTooltip = null;
        }
        azimuthStart = null;
      }

      function resetRuler() {
        if (rulerTemp) {
          map.removeLayer(rulerTemp);
          rulerTemp = null;
        }
        if (rulerTooltip) {
          map.closeTooltip(rulerTooltip);
          rulerTooltip = null;
        }
        if (rulerTotalLabel) {
          map.removeLayer(rulerTotalLabel);
          rulerTotalLabel = null;
        }
        rulerSegments.forEach((entry) => entry.layers.forEach((l) => map.removeLayer(l)));
        rulerSegments.length = 0;
        rulerStart = null;
        rulerTotalKm = 0;
        rulerStopped = false;
      }

      function setElevationVisible(enabled) {
        elevationEnabled = !!enabled;
        updateToolStates();
        if (enabled) {
          elevationLayer.addTo(map);
          if (bridge) { requestElevationPrefetch(); }
        } else {
          map.removeLayer(elevationLayer);
        }
      }

      function requestElevationPrefetch() {
        if (!bridge) { return; }
        const b = map.getBounds();
        bridge.prefetchElevation(b.getSouth(), b.getWest(), b.getNorth(), b.getEast(), map.getZoom());
      }

      function reportViewportToBridge() {
        if (!bridge || !bridge.reportViewport) { return; }
        const b = map.getBounds();
        bridge.reportViewport(b.getSouth(), b.getWest(), b.getNorth(), b.getEast(), map.getZoom());
      }

      map.on('movestart', () => {
        if (coverageEnabled && !coverageSuppressed) {
          coverageSuppressed = true;
          map.removeLayer(coverageLayer);
        }
      });

      map.on('zoomstart', () => {
        if (coverageEnabled && !coverageSuppressed) {
          coverageSuppressed = true;
          map.removeLayer(coverageLayer);
        }
      });

      map.on('moveend', () => {
        if (coverageSuppressed) {
          coverageSuppressed = false;
          if (coverageEnabled) {
            coverageLayer.addTo(map);
          }
        }
        reportViewportToBridge();
        if (map.hasLayer(elevationLayer)) {
          requestElevationPrefetch();
        }
      });

      map.on('zoomend', () => {
        if (coverageSuppressed) {
          coverageSuppressed = false;
          if (coverageEnabled) {
            coverageLayer.addTo(map);
          }
        }
        reportViewportToBridge();
        if (map.hasLayer(elevationLayer)) {
          requestElevationPrefetch();
        }
      });

      map.on('mousemove', (e) => {
        if (azimuthMode && azimuthStart) {
          const now = performance.now();
          if (now - azimuthLastRenderTs >= AZIMUTH_MOUSEMOVE_MS) {
            azimuthLastRenderTs = now;
            updateAzimuthTemp(e.latlng);
          }
        }
        if (rulerMode && rulerStart && !rulerStopped) {
          updateRulerTemp(e.latlng);
        }
        if (losMode && losStart) {
          updateLosTemp(e.latlng);
        }
        if (heightMode) {
          if (bridge) { bridge.reportHeight(e.latlng.lat, e.latlng.lng, e.originalEvent.clientX, e.originalEvent.clientY); }
        }
      });

      map.on('click', (e) => {
        clearSearchUI(true);
        if (azimuthMode) {
          handleAzimuthClick(e.latlng);
          return;
        }
        if (rulerMode) {
          if (!rulerStopped) {
            handleRulerClick(e.latlng);
          }
          return;
        }
        if (losMode) {
          if (!losStart) {
            losStart = e.latlng;
            updateLosTemp(e.latlng);
          }
        }
        if (bridge) { bridge.mapClick(e.latlng.lat, e.latlng.lng); }
      });

      map.on('contextmenu', (e) => {
        const x = e.originalEvent.clientX;
        const y = e.originalEvent.clientY;
        if (rulerMode) {
          L.DomEvent.stop(e);
          stopRuler();
          return;
        }
        ensureBridgeReady(() => bridge.showContextMenu(e.latlng.lat, e.latlng.lng, x, y));
      });
      window.addMarker = addMarker;
      window.moveMarker = moveMarker;
      window.updateMarkerLabel = updateMarkerLabel;
      window.removeMarker = removeMarker;
      window.setMarkerStatus = setMarkerStatus;
      window.addLink = addLink;
      window.updateLink = updateLink;
      window.removeLink = removeLink;
      window.focusMarker = focusMarker;
      window.setLinkMode = setLinkMode;
      window.setHeightMode = setHeightMode;
      window.setLosMode = setLosMode;
      window.setAzimuthMode = setAzimuthMode;
      window.setRulerMode = setRulerMode;
      window.addHorizonPoint = addHorizonPoint;
      window.clearHorizonPoints = clearHorizonPoints;
      window.setElevationVisible = setElevationVisible;
      window.addCoverage = addCoverage;
      window.updateCoverage = updateCoverage;
      window.updateCoveragePoints = updateCoveragePoints;
      window.updateCoverageBands = updateCoverageBands;
      window.updateCoverageRasterTile = updateCoverageRasterTile;
      window.updateCoverageRasterTiles = updateCoverageRasterTiles;
      window.removeCoverage = removeCoverage;
      window.setCoverageVisible = setCoverageVisible;
      window.clearCoverages = clearCoverages;
      window.clearAll = function () {
        markers.forEach((m) => map.removeLayer(m));
        markers.clear();
        [...links.keys()].forEach((id) => removeLink(id));
        clearCoverages();
        azimuthMeasures.forEach((entry) => entry.layers.forEach((l) => map.removeLayer(l)));
        azimuthMeasures.clear();
        resetAzimuthTemp();
        resetRuler();
      };
      window.requestElevationPrefetch = requestElevationPrefetch;
      window.showSearchResults = showSearchResults;
      window.focusSearchInput = focusSearchInput;

      ensureBridgeReady(() => {
        bindToolButtons();
        bindSearchControls();
        bindKeyboardShortcuts();
        reportViewportToBridge();
      });

      function bearingDeg(a, b) {
        const lat1 = a.lat * Math.PI / 180;
        const lat2 = b.lat * Math.PI / 180;
        const dLon = (b.lng - a.lng) * Math.PI / 180;
        const y = Math.sin(dLon) * Math.cos(lat2);
        const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
        let brng = Math.atan2(y, x) * 180 / Math.PI;
        brng = (brng + 360) % 360;
        return brng;
      }

      function handleAzimuthClick(latlng) {
        if (!azimuthStart) {
          azimuthStart = latlng;
          azimuthLastRenderTs = 0;
          updateAzimuthTemp(latlng);
          return;
        }
        finalizeAzimuthMeasure(clampAzimuthTarget(latlng));
        azimuthStart = null;
      }

      function clampAzimuthTarget(latlng) {
        if (!azimuthStart || !latlng) { return latlng; }
        const rawDistanceKm = map.distance(azimuthStart, latlng) / 1000.0;
        if (rawDistanceKm <= MAX_AZIMUTH_DISTANCE_KM) { return latlng; }
        const az = bearingDeg(azimuthStart, latlng);
        return destinationPoint(azimuthStart, az, MAX_AZIMUTH_DISTANCE_KM);
      }

      function updateAzimuthTemp(latlng) {
        if (!azimuthStart) { return; }
        const target = clampAzimuthTarget(latlng);
        const distanceM = map.distance(azimuthStart, target);
        const distanceKm = distanceM / 1000.0;
        const clamped = distanceKm >= MAX_AZIMUTH_DISTANCE_KM;
        if (!azimuthTemp) {
          const line = L.polyline([azimuthStart, target], { color: '#22c55e', weight: 3, dashArray: '6 6' });
          line.addTo(map);
          azimuthTemp = { layers: [line], line };
        } else {
          azimuthTemp.line.setLatLngs([azimuthStart, target]);
        }
        const az = bearingDeg(azimuthStart, target);
        const limitNote = clamped ? ` (ліміт ${MAX_AZIMUTH_DISTANCE_KM} км)` : '';
        const content = `Азимут: ${az.toFixed(1)}°<br>Дистанція: ${distanceKm.toFixed(2)} км${limitNote}`;
        if (!azimuthTooltip) {
          azimuthTooltip = L.tooltip({ permanent: false, direction: 'top', offset: [0, -10], opacity: 0.9 })
            .setLatLng(target)
            .setContent(content)
            .openOn(map);
        } else {
          azimuthTooltip.setLatLng(target);
          azimuthTooltip.setContent(content);
        }
      }

      function finalizeAzimuthMeasure(latlng) {
        if (!azimuthStart) { return; }
        const target = clampAzimuthTarget(latlng);
        const distanceM = map.distance(azimuthStart, target);
        if (distanceM < 1) {
          resetAzimuthTemp();
          return;
        }
        const az = bearingDeg(azimuthStart, target);
        const distanceKm = distanceM / 1000.0;
        const id = `az-${azimuthMeasureId++}`;
        const layers = [];

        const line = L.polyline([azimuthStart, target], { color: '#22c55e', weight: 3 });
        line.addTo(map);
        layers.push(line);

        const label = L.marker(target, {
          icon: L.divIcon({
            className: 'azimuth-label',
            html: `<div style="background: rgba(15,23,32,0.82); color: #ffffff; padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; min-width: 160px; text-align: center; white-space: nowrap; box-shadow: 0 8px 16px rgba(0,0,0,0.4);">${az.toFixed(1)}° • ${distanceKm.toFixed(2)} км</div>`,
          }),
          interactive: false,
        });
        label.addTo(map);
        layers.push(label);

        layers.forEach((layer) => {
          layer.on('contextmenu', (e) => {
            L.DomEvent.stop(e);
            showAzimuthDeletePopup(id, e.latlng);
          });
        });

        if (azimuthMeasures.size >= MAX_AZIMUTH_MEASURES) {
          const oldestId = azimuthMeasures.keys().next().value;
          const oldest = azimuthMeasures.get(oldestId);
          if (oldest) {
            oldest.layers.forEach((layer) => map.removeLayer(layer));
            azimuthMeasures.delete(oldestId);
          }
        }
        azimuthMeasures.set(id, { layers });
        resetAzimuthTemp();
      }

      function showAzimuthDeletePopup(id, latlng) {
        const popup = L.popup({ closeButton: true })
          .setLatLng(latlng)
          .setContent(`<button id="del-${id}" style="padding:4px 8px;">Видалити об'єкт</button>`)
          .openOn(map);
        setTimeout(() => {
          const btn = document.getElementById(`del-${id}`);
          if (!btn) { return; }
          btn.onclick = () => {
            const entry = azimuthMeasures.get(id);
            if (entry) {
              entry.layers.forEach((layer) => map.removeLayer(layer));
              azimuthMeasures.delete(id);
            }
            map.closePopup(popup);
          };
        }, 0);
      }

      function handleRulerClick(latlng) {
        if (!rulerStart) {
          rulerStart = latlng;
          updateRulerTemp(latlng);
          return;
        }
        finalizeRulerSegment(latlng);
        rulerStart = latlng;
      }

      function updateRulerTemp(latlng) {
        if (!rulerStart || !latlng) { return; }
        const distanceM = map.distance(rulerStart, latlng);
        if (!rulerTemp) {
          rulerTemp = L.polyline([rulerStart, latlng], { color: '#38bdf8', weight: 2, dashArray: '6 6' });
          rulerTemp.addTo(map);
        } else {
          rulerTemp.setLatLngs([rulerStart, latlng]);
        }
        const totalKm = rulerTotalKm + distanceM / 1000.0;
        const content = `Відстань: ${totalKm.toFixed(2)} км`;
        updateRulerTooltip(latlng, content);
      }

      function finalizeRulerSegment(latlng) {
        if (!rulerStart || !latlng) { return; }
        const distanceM = map.distance(rulerStart, latlng);
        const segmentKm = distanceM / 1000.0;
        rulerTotalKm += segmentKm;

        const line = L.polyline([rulerStart, latlng], { color: '#0ea5e9', weight: 3 });
        line.addTo(map);

        const mid = L.latLng((rulerStart.lat + latlng.lat) / 2, (rulerStart.lng + latlng.lng) / 2);
        const label = L.marker(mid, {
          icon: L.divIcon({
            className: 'ruler-label',
            html: `<div style="background: rgba(15,23,32,0.85); color: #ffffff; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; min-width: 110px; text-align: center; white-space: nowrap; box-shadow: 0 6px 14px rgba(0,0,0,0.35);">${segmentKm.toFixed(2)} км</div>`,
          }),
          interactive: false,
        });
        label.addTo(map);

        rulerSegments.push({ layers: [line, label] });

        const totalContent = `Відстань: ${rulerTotalKm.toFixed(2)} км`;
        updateRulerTooltip(latlng, totalContent);
        updateRulerTotalLabel(latlng);
        if (rulerTemp) {
          map.removeLayer(rulerTemp);
          rulerTemp = null;
        }
        updateRulerTemp(latlng);
      }

      function stopRuler() {
        rulerStopped = true;
        if (rulerTemp) {
          map.removeLayer(rulerTemp);
          rulerTemp = null;
        }
        if (rulerTooltip) {
          map.closeTooltip(rulerTooltip);
          rulerTooltip = null;
        }
        rulerStart = null;
      }

      function updateRulerTooltip(latlng, content) {
        if (!latlng) { return; }
        if (!rulerTooltip) {
          rulerTooltip = L.tooltip({ permanent: false, sticky: true, direction: 'top', offset: [0, -10], opacity: 0.9 });
        }
        rulerTooltip.setLatLng(latlng);
        rulerTooltip.setContent(content);
        map.openTooltip(rulerTooltip);
      }

      function updateRulerTotalLabel(latlng) {
        if (!latlng) { return; }
        const html = `<div style="background: rgba(15,23,32,0.85); color: #ffffff; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; min-width: 120px; text-align: center; white-space: nowrap; box-shadow: 0 6px 14px rgba(0,0,0,0.35);">Відстань: ${rulerTotalKm.toFixed(2)} км</div>`;
        if (!rulerTotalLabel) {
          rulerTotalLabel = L.marker(latlng, {
            icon: L.divIcon({ className: 'ruler-total', html }),
            interactive: false,
          });
          rulerTotalLabel.addTo(map);
        } else {
          rulerTotalLabel.setLatLng(latlng);
          rulerTotalLabel.setIcon(L.divIcon({ className: 'ruler-total', html }));
        }
      }
    </script>
  </body>
</html>
