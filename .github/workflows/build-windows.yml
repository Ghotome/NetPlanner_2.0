name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [publish]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -c constraints/build.txt ".[build]"
      - name: Prepare Windows icon
        shell: cmd
        run: >
          python -c "from PIL import Image; src='app/ui/icons/app_icons/app_icon_96_96.png'; dst='app/ui/icons/app_icons/app_icon.ico';
          img=Image.open(src).convert('RGBA'); img.save(dst, sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(96,96)]); print('Saved', dst)"
      - name: Build (portable onedir)
        shell: cmd
        run: >
          pyinstaller --noconfirm --windowed --name NetPlanner
          --icon "app\\ui\\icons\\app_icons\\app_icon.ico"
          --add-data "app\\web;app\\web"
          --add-data "app\\ui\\icons;app\\ui\\icons"
          --add-data "app\\icon.svg;app\\icon.svg"
          --collect-data PySide6
          --collect-data PySide6.QtWebEngineCore
          --collect-data PySide6.QtWebEngineWidgets
          --collect-binaries PySide6
          --collect-binaries PySide6.QtWebEngineCore
          --collect-binaries PySide6.QtWebEngineWidgets
          --hidden-import PySide6.QtCore
          --hidden-import PySide6.QtGui
          --hidden-import PySide6.QtWidgets
          --hidden-import PySide6.QtWebChannel
          --hidden-import PySide6.QtWebEngineCore
          --hidden-import PySide6.QtWebEngineWidgets
          --exclude-module PySide6.Qt3DAnimation
          --exclude-module PySide6.Qt3DCore
          --exclude-module PySide6.Qt3DExtras
          --exclude-module PySide6.Qt3DInput
          --exclude-module PySide6.Qt3DLogic
          --exclude-module PySide6.Qt3DRender
          --exclude-module PySide6.QtBluetooth
          --exclude-module PySide6.QtCharts
          --exclude-module PySide6.QtMultimedia
          --exclude-module PySide6.QtMultimediaWidgets
          --exclude-module PySide6.QtPdf
          --exclude-module PySide6.QtPositioning
          --exclude-module PySide6.QtQml
          --exclude-module PySide6.QtQuick
          --exclude-module PySide6.QtQuick3D
          --exclude-module PySide6.QtQuickControls2
          --exclude-module PySide6.QtQuickWidgets
          --exclude-module PySide6.QtSvg
          --exclude-module PySide6.QtSvgWidgets
          app\\main.py
      - name: Package artifact
        run: |
          Compress-Archive -Path dist\\NetPlanner\\* -DestinationPath NetPlanner-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NetPlanner-windows
          path: NetPlanner-windows.zip
