name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [publish]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Build (portable onedir)
        run: |
          pyinstaller --noconfirm --windowed --name NetPlanner ^
            --add-data "app\\web;app\\web" ^
            --add-data "app\\ui\\icons;app\\ui\\icons" ^
            --add-data "app\\icon.svg;app\\icon.svg" ^
            --collect-data PySide6 ^
            --collect-data PySide6.QtWebEngineCore ^
            --collect-data PySide6.QtWebEngineWidgets ^
            --collect-submodules PySide6 ^
            --collect-submodules PySide6.QtWebEngineCore ^
            --collect-submodules PySide6.QtWebEngineWidgets ^
            app\\main.py
      - name: Package artifact
        run: |
          Compress-Archive -Path dist\\NetPlanner\\* -DestinationPath NetPlanner-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NetPlanner-windows
          path: NetPlanner-windows.zip
